      <path d="M128,104 C152,102 176,100 192,100 L192,110 L128,116 Z" fill="url(#hb)"/>
    </g>
    <!-- legs: outline pass then fill pass -->
    <g fill="none" stroke-width="16">
      <path d="M84,70 L78,52 L58,46"/><path d="M118,66 L136,50 L120,42"/>
      <path d="M84,130 L78,148 L58,154"/><path d="M118,134 L136,150 L120,158"/>
    </g>
    <g fill="none" stroke="#c9a56e" stroke-width="11.5">
