    <path d="M58,46 L47,42 M58,46 L46,48 M58,46 L50,55 M120,42 L110,37 M120,42 L108,44 M120,42 L112,51 M58,154 L47,158 M58,154 L46,152 M58,154 L50,145 M120,158 L110,163 M120,158 L108,156 M120,158 L112,149" stroke-width="2"/>
