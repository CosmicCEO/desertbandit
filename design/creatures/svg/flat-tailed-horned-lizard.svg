    <path d="M62,100 L132,100" stroke="#4a3220" stroke-width="7" stroke-linecap="round"/>
    <path d="M132,100 C152,100 172,100 190,99.6" stroke="#4a3220" stroke-width="4" stroke-linecap="round"/>
    <!-- darker blotches either side of the stripe -->
    <g fill="#8f6a3e" stroke="none">
      <ellipse cx="84" cy="84" rx="6" ry="4.6"/><ellipse cx="106" cy="82" rx="6.4" ry="4.6"/><ellipse cx="122" cy="90" rx="4.6" ry="3.6"/>
      <ellipse cx="84" cy="116" rx="6" ry="4.6"/><ellipse cx="106" cy="118" rx="6.4" ry="4.6"/><ellipse cx="122" cy="110" rx="4.6" ry="3.6"/>
    </g>
    <!-- head -->
    <path d="M13,100 C18,88 34,81 52,83 L68,88 L68,112 L52,117 C34,119 18,112 13,100 Z" fill="#cfae78"/>
    <path d="M13,102 C20,114 36,120 52,117 L68,112 L68,106 C48,112 28,110 13,102 Z" fill="url(#hb)" stroke="none"/>
    <path d="M58,100 L20,100" stroke="#4a3220" stroke-width="3.4"/>
    <!-- crown of horns -->
        <path d="M62,90 Q88,86 112,62 Q98,92 74,100 Z" fill="#bd9358"/>
    <path d="M62,110 Q88,114 112,138 Q98,108 74,100 Z" fill="#bd9358"/>
    <path d="M54,86 Q62,72 80,58 Q76,80 68,94 Z" fill="#c7a066"/>
    <path d="M54,114 Q62,128 80,142 Q76,120 68,106 Z" fill="#c7a066"/>
    <path d="M70,92 Q92,84 106,68 M70,108 Q92,116 106,132 M64,86 Q72,74 76,66 M64,114 Q72,126 76,134" stroke-width="1.3"/>
  </g>
  <!-- eyes and nostrils -->
  <circle cx="38" cy="92" r="4.2" fill="#f4ebd3" stroke="#2b1d12" stroke-width="1.6"/>
  <circle cx="37" cy="92" r="2.3" fill="#2b1d12"/>
  <circle cx="38" cy="108" r="4.2" fill="#f4ebd3" stroke="#2b1d12" stroke-width="1.6"/>
  <circle cx="37" cy="108" r="2.3" fill="#2b1d12"/>
  <circle cx="19" cy="96" r="1.3" fill="#2b1d12"/><circle cx="19" cy="104" r="1.3" fill="#2b1d12"/>
</svg>
