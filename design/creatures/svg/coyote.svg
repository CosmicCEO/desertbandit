<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke-linejoin="round" stroke-linecap="round">
  <title>Coyote (Canis latrans)</title>
  <defs>
    <pattern id="hb" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#3b2814" stroke-width="1.1" opacity=".75"/>
    </pattern>
  </defs>
  <g stroke="#2b1d12" stroke-width="2.4">
    <!-- tail hanging low, black tip -->
    <path d="M146,96 C172,94 192,114 192,150 C192,170 180,178 170,168 C170,148 162,124 142,114 Z" fill="#a89a80"/>
    <path d="M166,106 C182,112 192,128 192,150 C192,170 180,178 170,168 C172,148 168,128 154,116 Z" fill="url(#hb)" stroke="none"/>
    <path d="M192,152 C192,170 180,178 170,168 C169,162 171,158 174,154 C182,158 188,158 192,152 Z" fill="#2b1d12"/>
    <!-- far legs -->
    <path d="M78,124 L93,126 C92,144 89,160 89,172 L90,182 L82,182 L82,172 C81,160 78,144 78,124 Z" fill="#8f4f2c"/>
    <ellipse cx="85" cy="184.5" rx="9" ry="3.6" fill="#8f4f2c"/>
    <path d="M112,126 L130,130 C127,146 124,158 123,170 L124,182 L116,182 L117,170 C117,158 114,144 112,126 Z" fill="#8f4f2c"/>
    <ellipse cx="119" cy="184.5" rx="9" ry="3.6" fill="#8f4f2c"/>
    <!-- near front leg, tucked under the shoulder -->
    <path d="M60,116 L79,116 C79,138 75,156 74,170 L75,182 L66,182 L66,170 C64,156 60,138 60,116 Z" fill="#c4743f"/>
    <path d="M72,118 L79,116 C79,138 75,156 74,170 L75,182 L70,182 L70,168 Z" fill="url(#hb)" stroke="none"/>
    <ellipse cx="68" cy="184.5" rx="9" ry="3.6" fill="#c4743f"/>
    <!-- body, shoulders and neck in one shape -->
    <path d="M62,52 C76,64 84,82 98,86 C120,82 142,86 152,98 C162,112 158,130 142,136 L78,138 C62,136 48,124 42,104 C38,88 34,72 32,58 Z" fill="#a89a80"/>
    <path d="M98,86 C120,82 142,86 152,98 C162,112 158,130 142,136 C122,138 104,134 94,126 C106,118 108,98 98,86 Z" fill="url(#hb)" stroke="none"/>
    <path d="M110,96 C118,102 120,112 116,124 M126,94 C134,100 136,110 132,122" stroke-width="1.3" stroke="#4a3320"/>
    <!-- pale throat and chest -->
    <path d="M32,58 C34,74 38,88 42,104 C48,124 62,136 78,138 C64,128 56,110 54,92 C52,80 50,68 50,58 Z" fill="#f4ebd3"/>
    <path d="M44,86 L50,92 M42,98 L50,104 M46,110 L54,114" stroke-width="1.2" stroke="#7d6a4c"/>
    <!-- near hind leg -->
    <path d="M124,102 C148,96 164,114 158,140 C154,150 149,158 148,168 L150,182 L141,182 L141,168 C140,158 134,152 126,140 Z" fill="#c4743f"/>
    <path d="M148,118 C158,122 160,134 158,140 C154,150 149,158 148,168 L150,182 L145,182 L145,166 C148,154 150,136 148,118 Z" fill="url(#hb)" stroke="none"/>
    <ellipse cx="145" cy="184.5" rx="9" ry="3.6" fill="#c4743f"/>
    <!-- far ear -->
    <path d="M56,36 C62,22 72,14 82,12 C84,26 80,38 70,46 Z" fill="#8f4f2c"/>
    <!-- lower jaw, mouth open -->
    <path d="M24,32 C18,34 12,38 8,44 C12,48 20,50 30,52 C38,54 44,56 48,56 C42,48 32,40 24,32 Z" fill="#f4ebd3"/>
    <path d="M24,32 C30,38 38,46 48,56 C40,52 30,48 22,44 Z" fill="#6b2a2a" stroke="none"/>
    <!-- head: skull and upturned muzzle -->
    <path d="M14,12 C22,10 30,16 38,22 C46,24 54,26 60,32 C68,40 68,52 60,58 C52,62 44,60 40,54 C32,46 24,38 20,28 C16,24 12,18 14,12 Z" fill="#a89a80"/>
    <path d="M46,40 C54,36 62,34 60,32 C68,40 68,52 60,58 C52,62 44,60 40,54 C46,50 46,46 46,40 Z" fill="url(#hb)" stroke="none"/>
    <!-- near ear, rusty -->
    <path d="M50,30 C52,14 62,4 74,2 C76,18 74,32 64,42 Z" fill="#c4743f"/>
    <path d="M58,30 C60,20 64,14 68,10 C70,20 68,28 63,35 Z" fill="#f4ebd3" stroke="none"/>
    <path d="M62,40 C70,32 74,20 74,2 C76,18 74,32 64,42 Z" fill="url(#hb)" stroke="none"/>
  </g>
  <!-- nose, eye -->
  <ellipse cx="15" cy="14" rx="4.4" ry="3.6" transform="rotate(-30 15 14)" fill="#2b1d12"/>
  <path d="M34,28 C38,24 44,26 46,30 C42,34 36,33 34,28 Z" fill="#f4ebd3" stroke="#2b1d12" stroke-width="1.4"/>
  <circle cx="41" cy="29.5" r="2.4" fill="#2b1d12"/>
  <path d="M20,30 C28,36 36,42 42,52" stroke="#2b1d12" stroke-width="1.5"/>
</svg>
