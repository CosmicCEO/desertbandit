<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke-linejoin="round" stroke-linecap="round">
  <title>Desert blonde tarantula (Aphonopelma sp.)</title>
  <defs>
    <pattern id="dt-hb" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#2f2216" stroke-width="1.1" opacity=".75"/>
    </pattern>
    <pattern id="dt-hf" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <line x1="0" y1="0" x2="0" y2="3" stroke="#1c120a" stroke-width=".9" opacity=".7"/>
    </pattern>
    <!-- left half: four legs and a pedipalp (mirrored for the right side) -->
    <g id="dt-half" stroke="#2b1d12" stroke-width="2.4">
      <path d="M84,76 C66,62 48,52 32,34 C26,32 20,40 22,48" stroke-width="11"/>
      <path d="M80,88 C60,70 36,68 20,76 C12,80 8,88 10,96" stroke-width="11"/>
      <path d="M80,100 C56,98 34,108 22,126 C16,136 12,142 14,150" stroke-width="11"/>
      <path d="M84,110 C66,124 48,142 42,164 C40,174 42,182 44,188" stroke-width="11"/>
      <path d="M84,76 C66,62 48,52 32,34 C26,32 20,40 22,48" stroke="#d2ab62" stroke-width="7"/>
      <path d="M80,88 C60,70 36,68 20,76 C12,80 8,88 10,96" stroke="#d2ab62" stroke-width="7"/>
      <path d="M80,100 C56,98 34,108 22,126 C16,136 12,142 14,150" stroke="#d2ab62" stroke-width="7"/>
      <path d="M84,110 C66,124 48,142 42,164 C40,174 42,182 44,188" stroke="#d2ab62" stroke-width="7"/>
      <!-- shadow-side fuzz on each leg -->
      <path d="M84,80 C68,66 52,56 36,40 M82,92 C62,76 40,72 22,80 M82,104 C58,102 38,112 26,128 M86,114 C68,128 52,146 44,164" stroke="#7a5430" stroke-width="2" opacity=".75"/>
      <!-- hairs and joints -->
      <path d="M56,54 L52,48 M34,36 L30,30 M46,76 L44,70 M20,76 L16,70 M42,106 L38,100 M22,124 L16,122 M56,136 L50,134 M40,162 L34,162 M70,64 L68,58 M30,80 L28,86 M32,114 L30,120 M48,148 L54,150" stroke-width="1.3" stroke="#6b4a12"/>
      <path d="M56,54 L58,60 M46,76 L46,82 M42,106 L44,112 M56,136 L60,132" stroke-width="1.6"/>
      <!-- pedipalp -->
      <path d="M93,70 L84,54 L82,44" stroke-width="8"/>
      <path d="M93,70 L84,54 L82,44" stroke="#e0bf80" stroke-width="4.4"/>
    </g>
  </defs>
  <use href="#dt-half"/>
  <use href="#dt-half" transform="translate(200 0) scale(-1 1)"/>
  <g stroke="#2b1d12" stroke-width="2.4">
    <!-- round, furry abdomen -->
    <path d="M100,100 C132,100 144,124 140,150 C136,176 118,190 100,190 C82,190 64,176 60,150 C56,124 68,100 100,100 Z" fill="#5a3a24"/>
    <path d="M100,104 C128,104 142,126 140,150 C136,176 118,190 100,190 C112,176 118,150 112,126 C110,116 106,108 100,104 Z" fill="url(#dt-hb)" stroke="none"/>
    <path d="M100,104 C128,104 142,126 140,150 C136,176 118,190 100,190 C82,190 64,176 60,150 C56,126 70,104 100,104 Z" fill="url(#dt-hf)" stroke="none"/>
    <path d="M70,126 C74,116 82,110 90,108 M64,146 C64,140 66,134 68,132 M78,170 C72,164 68,158 66,152" stroke="#9a6a3a" stroke-width="1.8" opacity=".9"/>
    <path d="M86,114 L84,108 M98,110 L98,104 M112,114 L114,108 M72,132 L66,130 M128,132 L134,130 M66,156 L60,158 M134,156 L140,158 M74,176 L70,182 M126,176 L130,182 M90,184 L88,190 M110,184 L112,190 M84,122 L80,118 M118,124 L122,120" stroke-width="1.3" stroke="#3a2414"/>
    <!-- carapace -->
    <path d="M100,64 C118,64 128,76 126,90 C124,104 114,112 100,112 C86,112 76,104 74,90 C72,76 82,64 100,64 Z" fill="#d6b270"/>
    <path d="M100,70 C116,72 126,82 126,92 C124,104 114,112 100,112 C108,100 110,82 100,70 Z" fill="url(#dt-hb)" stroke="none"/>
    <path d="M100,86 L100,96" stroke-width="2"/>
    <path d="M84,76 C90,72 94,70 98,70 M80,92 C80,86 82,82 84,80" stroke="#f4ebd3" stroke-width="1.6" opacity=".85"/>
    <!-- fangs and eye mound -->
    <path d="M94,66 L92,56 M106,66 L108,56" stroke-width="6.4"/>
    <path d="M94,66 L92,56 M106,66 L108,56" stroke="#3a2414" stroke-width="3"/>
  </g>
  <circle cx="96" cy="72" r="1.8" fill="#2b1d12"/>
  <circle cx="104" cy="72" r="1.8" fill="#2b1d12"/>
</svg>
