<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke-linejoin="round" stroke-linecap="round">
  <title>Chuckwalla (Sauromalus ater)</title>
  <defs>
    <pattern id="cw-h" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#2f2216" stroke-width="1.1" opacity=".75"/>
    </pattern>
    <clipPath id="cw-clip">
      <path d="M12,122 C14,106 28,96 44,94 C54,92 62,92 70,88 C84,80 112,78 134,84 C152,88 170,98 196,116 C198,122 192,126 186,125 C172,124 160,128 150,134 C136,142 100,144 76,140 C66,138 60,134 56,132 C42,136 22,134 12,122 Z"/>
    </clipPath>
  </defs>
  <g stroke="#2b1d12" stroke-width="2.4">
    <!-- far legs (darker), splayed like a lizard's -->
    <g fill="none" stroke-width="13"><path d="M66,128 C62,140 52,148 38,150"/><path d="M148,128 C154,140 166,146 182,146"/></g>
    <g fill="none" stroke-width="9" stroke="#2f2f35"><path d="M66,128 C62,140 52,148 38,150"/><path d="M148,128 C154,140 166,146 182,146"/></g>
    <path d="M38,150 L28,146 M38,150 L28,153 M38,150 L32,159 M182,146 L192,142 M182,146 L193,149 M182,146 L188,156" stroke-width="2.4"/>
    <!-- body: one silhouette for head, body and tail -->
    <path d="M12,122 C14,106 28,96 44,94 C54,92 62,92 70,88 C84,80 112,78 134,84 C152,88 170,98 196,116 C198,122 192,126 186,125 C172,124 160,128 150,134 C136,142 100,144 76,140 C66,138 60,134 56,132 C42,136 22,134 12,122 Z" fill="#dccaa0"/>
    <g clip-path="url(#cw-clip)" stroke="none">
      <!-- reddish-tan rear body with ragged edge -->
      <path d="M80,70 L168,70 L168,150 L80,150 Z" fill="#b8704a"/>
      <!-- dark head and shoulders with ragged edge -->
      <path d="M0,70 L96,70 C100,80 90,88 98,98 C90,108 100,116 92,126 C98,134 92,142 96,150 L0,150 Z" fill="#46454a"/>
      <g fill="#7a3f22"><circle cx="120" cy="96" r="2"/><circle cx="134" cy="100" r="2.2"/><circle cx="126" cy="112" r="2"/><circle cx="144" cy="108" r="1.8"/><circle cx="140" cy="92" r="1.8"/></g>
      <!-- engraved shading along the belly and under the tail -->
      <path d="M20,128 C50,140 100,146 150,134 C164,128 176,128 196,126 L196,150 L20,150 Z" fill="url(#cw-h)"/>
    </g>
    <!-- loose skin folds at the neck and flank, scalloped belly -->
    <path d="M62,94 C72,104 72,120 64,132 M74,90 C84,102 84,118 76,134" stroke-width="1.5" stroke="#16130f"/>
    <path d="M112,90 C120,100 120,116 114,128 M128,86 C136,96 136,110 132,122" stroke-width="1.4" stroke="#5a3318"/>
    <path d="M80,138 C86,142 94,142 100,138 C106,144 116,144 122,139 C128,142 136,140 142,136" stroke-width="1.3" stroke="#2f2216"/>
    <!-- outline again over the tints -->
    <path d="M12,122 C14,106 28,96 44,94 C54,92 62,92 70,88 C84,80 112,78 134,84 C152,88 170,98 196,116 C198,122 192,126 186,125 C172,124 160,128 150,134 C136,142 100,144 76,140 C66,138 60,134 56,132 C42,136 22,134 12,122 Z"/>
    <!-- near legs, bent out from the elbow, toes spread -->
    <g fill="none" stroke-width="14"><path d="M82,130 C80,144 72,152 58,158"/><path d="M132,132 C136,146 146,154 160,158"/></g>
    <g fill="none" stroke-width="10"><path d="M82,130 C80,144 72,152 58,158" stroke="#46454a"/><path d="M132,132 C136,146 146,154 160,158" stroke="#b8704a"/></g>
    <path d="M58,158 L46,153 M58,158 L47,160 M58,158 L50,167 M160,158 L172,153 M160,158 L171,160 M160,158 L168,167" stroke-width="2.6"/>
    <!-- mouth, brow, nostril -->
    <path d="M14,124 C26,130 42,130 54,126" stroke-width="1.8"/>
    <path d="M26,104 C34,98 44,98 50,102" stroke-width="2"/>
    <!-- highlight along the pale tail and back -->
    <path d="M150,90 C166,96 180,106 190,116" stroke="#f4ebd3" stroke-width="2.2" opacity=".85"/>
  </g>
  <ellipse cx="38" cy="108" rx="5" ry="4.2" fill="#f4ebd3" stroke="#2b1d12" stroke-width="1.6"/>
  <circle cx="37" cy="108.5" r="2.6" fill="#2b1d12"/>
  <circle cx="18" cy="115" r="1.5" fill="#2b1d12"/>
</svg>
